<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="description" content="Pitify — your pocket personal trainer" />
  <title>Pitify — Home Workout</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Background layers (Home + Login) -->
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>
  <div class="rain-layer" id="rain-layer"></div>
  <div class="fireflies-layer" id="fireflies-layer"></div>

  <!-- Login-only magical background -->
  <div class="login-bg-layer" id="login-bg-layer">
    <div class="light-beam lb-1"></div>
    <div class="light-beam lb-2"></div>
    <div class="light-beam lb-3"></div>
    <div class="glow-orb go-1"></div>
    <div class="glow-orb go-2"></div>
    <div class="glow-orb go-3"></div>
    <div class="glow-orb go-4"></div>
    <div class="bubble bu-1"></div>
    <div class="bubble bu-2"></div>
    <div class="bubble bu-3"></div>
    <div class="bubble bu-4"></div>
    <div class="bubble bu-5"></div>
    <div class="bubble bu-6"></div>
  </div>

  <div id="app"></div>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
